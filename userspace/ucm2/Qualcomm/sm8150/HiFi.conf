# Use case configuration for the Samsung Galaxy Tab S6 Wi-Fi (SM-T860,
# gts6lwifi) running mainline Linux.
#
# One playback path, and it is the only one this board has upstream:
#
#   MultiMedia1 (q6asm) -> q6routing -> SECONDARY_TDM_RX_0 (q6afe)
#                       -> Secondary TDM -> four CS35L41 amps
#
# Without this, WirePlumber falls back to the ACP profile path, finds nothing it
# recognises on a q6 card with 1130 controls, and leaves you with a Dummy Output
# and no sink at all.
#
# The headphone jack is not here because the CS48L33 it hangs off has no
# mainline driver.

SectionVerb {

	EnableSequence [
		cset "name='SEC_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		# capture: MultiMedia2 (hw:0,1) <- Quinary MI2S <- CS48L33 ASP1. The PipeWire
		# source for it is declared in /etc/pipewire/pipewire.conf.d, not here,
		# because a UCM capture device takes the whole card down.
		cset "name='MultiMedia2 Mixer QUIN_MI2S_TX' 1"
	]

	DisableSequence [
		cset "name='SEC_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
