# Galaxy Tab S6: the microphones as a PipeWire source, declared directly.
#
# WirePlumber's UCM path cannot be given a capture device on this card without
# taking the speaker sink down with it (see docs/AUDIO.md), so the capture PCM
# is created as a node here, outside the UCM/ACP machinery entirely. The
# q6routing control "MultiMedia2 Mixer QUIN_MI2S_TX" and the CS48L33 input
# routing are set by the UCM verb EnableSequence and persist.
context.objects = [
    {   factory = adapter
        args = {
            factory.name       = api.alsa.pcm.source
            node.name          = "alsa_input.tabs6.mic"
            node.description   = "Tab S6 Microphones"
            media.class        = "Audio/Source"
            api.alsa.path      = "hw:0,1"
            audio.format       = "S16LE"
            audio.rate         = 48000
            audio.channels     = 2
            audio.position     = [ FL FR ]
            node.pause-on-idle = true
            priority.session   = 1500
            priority.driver    = 1500
        }
    }
]
