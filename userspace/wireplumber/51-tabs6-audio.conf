# Galaxy Tab S6 (SM-T860): pin the speaker sink to S16_LE.
#
# The Secondary TDM backend is fixed at S16_LE in the machine driver, because
# cs35l41 derives its ASP slot width from the sample width and 24 does not
# divide the 32 bit TDM slots. Left to itself PipeWire opens the frontend as
# S24_LE, and the DSP does not convert it for this path: the amps power up, the
# route is enabled, the PCM runs, and nothing comes out. Raw S16_LE playback to
# hw:0,0 is loud and clear, which is what makes the format the difference.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
